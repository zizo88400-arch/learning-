{% extends "base.html" %}{% block content %}<section class="narrow"><h1>ملفي الشخصي</h1><div class="panel"><h2>{{ user.name }}</h2><p class="muted">{{ user.role }} · {{ user.grade or user.subject or '' }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>الاسم<input name="name" value="{{ user.name }}"></label><label>نبذة عنك<textarea name="bio">{{ user.bio or '' }}</textarea></label><button class="gold">حفظ</button></form></div><h2>نتائج الاختبارات</h2>{% for r in results %}<div class="item">{{ r.quiz.title }} — {{ r.score }}/{{ r.total }}</div>{% else %}<div class="empty">لا توجد نتائج بعد.</div>{% endfor %}<a href="{{ url_for('logout') }}">تسجيل الخروج</a></section>{% endblock %}
