{% extends "base.html" %}{% block content %}<h1>مجتمع الطلاب 💬</h1><div class="panel"><h3>ابدأ نقاش جديد</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="title" placeholder="عنوان السؤال أو النقاش" required><textarea name="body" placeholder="اكتب تفاصيل سؤالك..." required></textarea><button class="gold">نشر النقاش</button></form></div><h2>أحدث النقاشات</h2>{% for p in posts %}<a class="item discussion" href="{{ url_for('post',i=p.id) }}"><b>{{ p.title }}</b><p>{{ p.body[:150] }}</p><small>{{ p.user.name }}</small></a>{% else %}<div class="empty">كن أول من يبدأ نقاشًا!</div>{% endfor %}{% endblock %}
