{% extends "base.html" %}{% block content %}<section class="narrow"><h1>إضافة محتوى تعليمي</h1><div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>اسم المحتوى<input name="title" required></label><label>النوع<select name="kind"><option value="book">كتاب</option><option value="summary">ملخص / ملزمة</option><option value="video">محاضرة</option><option value="other">أخرى</option></select></label><label>الصف<select name="grade"><option>أولى ثانوي</option><option>تانية ثانوي</option><option>تالتة ثانوي</option></select></label><label>المادة<input name="subject"></label><label>رابط المحتوى<input name="url" type="url" placeholder="https://" required></label><label>وصف مختصر<textarea name="description"></textarea></label><button class="gold">إرسال للمراجعة</button></form></div></section>{% endblock %}
