{% extends "base.html" %}{% block content %}<a href="{{ url_for('forum') }}">← العودة للمنتدى</a><div class="panel"><h1>{{ post.title }}</h1><small>{{ post.user.name }}</small><p class="pre">{{ post.body }}</p></div><h2>الردود</h2>{% for r in replies %}<div class="item"><b>{{ r.user.name }}</b><p>{{ r.body }}</p></div>{% else %}<div class="empty">لا توجد ردود بعد.</div>{% endfor %}<div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><textarea name="body" placeholder="اكتب ردك..." required></textarea><button class="gold">إرسال الرد</button></form></div>{% endblock %}
