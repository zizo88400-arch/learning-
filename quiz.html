{% extends "base.html" %}{% block content %}<section class="narrow"><h1>{{ quiz.title }}</h1><form class="panel" method="post">{% for q in questions %}{% set qi=loop.index0 %}<h3>{{ loop.index }}. {{ q.question }}</h3>{% for c in q.choices %}<label class="choice"><input type="radio" name="q{{ qi }}" value="{{ loop.index }}" required> {{ c }}</label>{% endfor %}{% endfor %}<button class="gold">إنهاء الاختبار</button></form></section>{% endblock %}
